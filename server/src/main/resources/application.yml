server:
  port: 8080
  # 允许局域网内车机/真机访问（勿仅绑定 127.0.0.1）
  address: 0.0.0.0

spring:
  application:
    name: myassistant-server

management:
  endpoints:
    web:
      exposure:
        include: health,info

myassistant:
  asr:
    # mock | iflytek | vosk
    provider: ${MYASSISTANT_ASR_PROVIDER:vosk}
    # Vosk 模型目录（解压后的文件夹路径）
    vosk-model-path: ${MYASSISTANT_VOSK_MODEL_PATH:models/vosk-model-small-cn-0.22}

  wakeup:
    enabled: ${MYASSISTANT_WAKEUP_ENABLED:true}
    wake-word: ${MYASSISTANT_WAKE_WORD:嗨 小奇}
    # Vosk 下先做 grammar 受限唤醒识别，再走开放域 ASR（需 asr.provider=vosk）
    dedicated-path: ${MYASSISTANT_WAKEUP_DEDICATED_PATH:true}
    # 小模型 ASR 对「嗨小奇」的常见误识；仅当整句以该前缀开头时算唤醒，可按环境增删
    wake-aliases:
      - 嗨小齐
      - 小齐

  auth:
    # MVP: 先用简单 token；后续可换成 JWT/账号体系
    enabled: false
    static-bearer-token: "dev-token"

  iflytek:
    # 仅当 myassistant.asr.provider=iflytek 时使用
    app-id: ${MYASSISTANT_IFLYTEK_APP_ID:}
    api-key: ${MYASSISTANT_IFLYTEK_API_KEY:}
    api-secret: ${MYASSISTANT_IFLYTEK_API_SECRET:}
    # ASR/大模型等服务的具体 URL 可能随产品线变化，这里先留占位
    # 大模型多语种语音识别（短音频≤60秒）示例：wss://iat.cn-huabei-1.xf-yun.com/v1
    asr-ws-url: ${MYASSISTANT_IFLYTEK_ASR_WS_URL:wss://iat.cn-huabei-1.xf-yun.com/v1}
    spark-ws-url: ${MYASSISTANT_IFLYTEK_SPARK_WS_URL:}

  vlm:
    # VLM 提供商：mock | openai | qwen
    provider: ${MYASSISTANT_VLM_PROVIDER:mock}
    # API 端点 URL（OpenAI: https://api.openai.com/v1/chat/completions / Qwen: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions）
    api-url: ${MYASSISTANT_VLM_API_URL:}
    api-key: ${MYASSISTANT_VLM_API_KEY:}
    # 模型名称（OpenAI: gpt-4-vision-preview / gpt-4o / Qwen: qwen-vl-plus / qwen-vl-max）
    model: ${MYASSISTANT_VLM_MODEL:}
    # 最大输出 token 数
    max-tokens: 1024
    # 生成温度 (0.0~2.0)
    temperature: 0.7
    # 图片长边最大像素（超过会服务端压缩）
    max-image-size: 2048
    # 单次请求最大图片数
    max-images: 5

